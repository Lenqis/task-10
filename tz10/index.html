<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Todo-list</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <ul id="tabs" class="tabs">
        <li data-tab="all">Все</li>
        <li data-tab="active">Активные</li>
        <li data-tab="done">Выполненные</li>
    </ul>

    <button id="add" class="btn">Добавить</button>

    <input id="task" type="text" placeholder="Новая задача..." />

    <ul id="todos"></ul>

    <script src="app.js"></script>
</body>
</html>
